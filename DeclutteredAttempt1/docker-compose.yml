# A fixed project name, so the volume is always legacy_legacy-db no matter
# which directory compose is run from. Without it the project name comes from
# the directory, and a deploy run from a different path would silently create
# a second, empty database volume.
name: legacy

services:
  bot:
    # Deploys go by immutable digest, never by tag and never by rebuilding on
    # the host: `build: .` here would compile whatever source happens to be in
    # the working directory and silently ignore the digest the Deploy workflow
    # published, which is the whole guarantee the README describes.
    #
    #   IMAGE_DIGEST=ghcr.io/<owner>/<repo>@sha256:<digest> docker compose up -d
    #
    # The :? makes an unset digest a clear error from compose rather than a
    # container that starts on the wrong image. To build locally for
    # development instead, uncomment build: and drop image:.
    image: ${IMAGE_DIGEST:?set IMAGE_DIGEST to the ghcr digest to deploy}
    # build: .
    container_name: discord-bot
    env_file: .env
    environment:
      NODE_ENV: production
      LEGACY_DB_STORAGE: /data/database.db
      # player icons are uploaded at registration, so they are state, not
      # artwork: written into the same volume as the database rather than
      # into the image, where every deploy threw them away
      LEGACY_PLAYER_TILES_DIR: /data/player-tiles
    volumes:
      # named volume: game state survives image rebuilds. The old bind mount
      # (./data) pointed at a path the bot never wrote; the database lived
      # inside the image layer and every rebuild silently reset every game.
      - legacy-db:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  legacy-db:
