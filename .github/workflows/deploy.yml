# Publish + deploy. Deliberately conservative: merging builds nothing here -
# promotion to the live bot is a tag push, and the environment gate puts a
# human between the tag and a running game.
#
# The deploy job runs ON the host: a self-hosted Actions runner is registered
# on the Mac mini, so there is no SSH, no key to leak and no inbound port.
# Until DEPLOY_RUNNER_LABEL is set as a repository variable the job lands on
# a hosted runner, prints the manual steps and stops there; nothing touches
# the live bot.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      register_commands:
        description: Re-register slash commands with Discord (rate-limited; only when a command definition changed)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime image
        run: docker build --target runtime -t "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" DeclutteredAttempt1
      - name: Push by tag and capture the digest
        id: push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker push "$IMG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published $DIGEST - deploy by THIS digest, never by tag."

  deploy:
    # Gated by the production environment (add a required reviewer there), and
    # run ON the Mac mini by its own registered runner - the job is already on
    # the machine it deploys to, so it just runs docker.
    #
    # runs-on has to be decided before any step runs, so the switch is a
    # repository variable rather than an `if`: set DEPLOY_RUNNER_LABEL to the
    # runner's label (self-hosted) once the mini is registered. Unset, this
    # lands on a hosted runner and prints the manual steps instead of hanging
    # forever in a queue waiting for a runner that does not exist.
    if: github.event_name == 'push'
    needs: publish
    runs-on: ${{ vars.DEPLOY_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Backup, deploy by digest, verify, roll back on failure
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          RUNNER_LABEL: ${{ vars.DEPLOY_RUNNER_LABEL || '' }}
        run: |
          if [ -z "$RUNNER_LABEL" ]; then
            echo "No host runner configured (repository variable DEPLOY_RUNNER_LABEL is unset)."
            echo "Image published as: $IMAGE_DIGEST"
            echo "Promote it on the host with:"
            echo "  IMAGE_DIGEST=$IMAGE_DIGEST DeclutteredAttempt1/scripts/deploy.sh"
            echo "which backs up, pulls, brings compose up, verifies health and rolls back."
            exit 0
          fi
          bash DeclutteredAttempt1/scripts/deploy.sh "$IMAGE_DIGEST"

  register-commands:
    # manual, rate-limited side effect - never part of a container boot
    if: github.event_name == 'workflow_dispatch' && inputs.register_commands
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: DeclutteredAttempt1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: DeclutteredAttempt1/.nvmrc
          cache: npm
          cache-dependency-path: DeclutteredAttempt1/package-lock.json
      - run: npm ci --omit=dev
      - run: node scripts/register-commands.js
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
